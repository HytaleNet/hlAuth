plugins {
    id 'java'
}

group = 'com.authme'
version = '1.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Path to the local Hytale server jar. Override with -PhytaleServerJar=<path>
def hytaleServerJar = providers.gradleProperty('hytaleServerJar')
    .orElse(System.getenv('APPDATA') + '/HLauncher/install/release/package/game/latest/Server/HytaleServer.jar')
    .get()

dependencies {
    compileOnly files(hytaleServerJar)
    implementation 'com.h2database:h2:2.3.232'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
}

jar {
    archiveBaseName = 'hlAuth'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/services/java.sql.Driver'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
